<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Dashboard - HopeTech Performance Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .leaderboard-row:hover {
            background-color: #f9fafb;
        }
        .performance-excellent { color: #10b981; }
        .performance-good { color: #3b82f6; }
        .performance-average { color: #f59e0b; }
        .performance-needs-improvement { color: #ef4444; }
        .trend-up { color: #10b981; }
        .trend-down { color: #ef4444; }
        .trend-stable { color: #6b7280; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-purple-600 to-purple-800 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-chart-bar text-2xl"></i>
                    <div>
                        <h1 class="text-xl font-bold">Performance Analytics</h1>
                        <p class="text-purple-200 text-sm">Management Dashboard</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2 bg-white/10 rounded-lg px-4 py-2">
                        <i class="fas fa-calendar"></i>
                        <select id="periodSelect" class="bg-transparent text-white border-none focus:outline-none cursor-pointer">
                            <option value="current_month" class="text-gray-800">This Month</option>
                            <option value="last_month" class="text-gray-800">Last Month</option>
                            <option value="last_3_months" class="text-gray-800">Last 3 Months</option>
                        </select>
                    </div>
                    <button onclick="refreshData()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg transition-colors">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Team Overview Stats -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Total Executives</p>
                        <p class="text-3xl font-bold text-gray-800" id="totalExecutives">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-users text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Top Performer</p>
                        <p class="text-lg font-bold text-gray-800" id="topPerformer">-</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-trophy text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Avg Score</p>
                        <p class="text-3xl font-bold text-gray-800" id="avgScore">0</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-chart-line text-purple-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Excellent</p>
                        <p class="text-3xl font-bold text-green-600" id="excellentCount">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-star text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Needs Help</p>
                        <p class="text-3xl font-bold text-red-600" id="needsHelpCount">0</p>
                    </div>
                    <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-exclamation-triangle text-red-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Performance Distribution Chart -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-sm p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Performance Distribution</h2>
                <div class="h-64">
                    <canvas id="performanceDistributionChart"></canvas>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Target Completion Rates</h2>
                <div class="h-64">
                    <canvas id="targetCompletionChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Leaderboard -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-lg font-bold text-gray-800">Performance Leaderboard</h2>
                <div class="flex items-center space-x-2">
                    <input type="text" id="leaderboardSearch" placeholder="Search executives..."
                           class="border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <button onclick="exportLeaderboard()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm transition-colors">
                        <i class="fas fa-download mr-2"></i>Export
                    </button>
                </div>
            </div>

            <!-- Leaderboard Table -->
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="border-b">
                            <th class="text-left py-3 px-4 font-semibold text-gray-600">Rank</th>
                            <th class="text-left py-3 px-4 font-semibold text-gray-600">Executive</th>
                            <th class="text-left py-3 px-4 font-semibold text-gray-600">Score</th>
                            <th class="text-left py-3 px-4 font-semibold text-gray-600">Category</th>
                            <th class="text-left py-3 px-4 font-semibold text-gray-600">Target %</th>
                            <th class="text-left py-3 px-4 font-semibold text-gray-600">Visits</th>
                            <th class="text-left py-3 px-4 font-semibold text-gray-600">Referrals</th>
                            <th class="text-left py-3 px-4 font-semibold text-gray-600">Trend</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <!-- Leaderboard rows will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Performance Trends -->
        <div class="bg-white rounded-xl shadow-sm p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Performance Trends</h2>
            <div class="h-64">
                <canvas id="performanceTrendsChart"></canvas>
            </div>
        </div>
    </main>

    <script>
        // ================================================================
        // STATE MANAGEMENT
        // ================================================================
        let leaderboardData = [];
        let performanceDistributionChart = null;
        let targetCompletionChart = null;
        let performanceTrendsChart = null;

        // ================================================================
        // API CALLS
        // ================================================================
        const API_BASE = '/api/hopetech/marketing';

        async function fetchPerformanceAnalytics() {
            try {
                const period = document.getElementById('periodSelect').value;
                const response = await fetch(`${API_BASE}/analytics/performance?period_type=${period}`);
                const result = await response.json();
                if (result.success) {
                    renderTeamStats(result.data.team_aggregates);
                    leaderboardData = result.data.executive_performance;
                    renderLeaderboard();
                    renderPerformanceDistribution();
                    renderTargetCompletion();
                    renderPerformanceTrends();
                }
            } catch (error) {
                console.error('Error fetching performance analytics:', error);
            }
        }

        async function fetchLeaderboard() {
            try {
                const period = document.getElementById('periodSelect').value;
                const response = await fetch(`${API_BASE}/analytics/leaderboard?period_type=${period}`);
                const result = await response.json();
                if (result.success) {
                    leaderboardData = result.data.leaderboard;
                    renderLeaderboard();
                }
            } catch (error) {
                console.error('Error fetching leaderboard:', error);
            }
        }

        // ================================================================
        // RENDERING FUNCTIONS
        // ================================================================
        function renderTeamStats(stats) {
            document.getElementById('totalExecutives').textContent = stats.total_executives || 0;
            document.getElementById('topPerformer').textContent = stats.top_performer_score?.toFixed(1) + '%' || '-';
            document.getElementById('avgScore').textContent = stats.average_performance_score?.toFixed(1) || 0;
        }

        function renderLeaderboard() {
            const tbody = document.getElementById('leaderboardBody');
            const searchTerm = document.getElementById('leaderboardSearch').value.toLowerCase();

            const filteredData = leaderboardData.filter(executive =>
                executive.executive_name.toLowerCase().includes(searchTerm)
            );

            tbody.innerHTML = filteredData.map(executive => `
                <tr class="leaderboard-row border-b">
                    <td class="py-4 px-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center ${getRankBadge(executive.rank)}">
                                <span class="font-bold text-white text-sm">${executive.rank}</span>
                            </div>
                        </div>
                    </td>
                    <td class="py-4 px-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center">
                                <i class="fas fa-user text-gray-500"></i>
                            </div>
                            <div>
                                <p class="font-medium text-gray-800">${executive.executive_name}</p>
                                <p class="text-xs text-gray-500">ID: ${executive.executive_id.substring(0, 8)}...</p>
                            </div>
                        </div>
                    </td>
                    <td class="py-4 px-4">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-gray-800">${executive.performance_score?.toFixed(1) || 0}</span>
                            <span class="px-2 py-1 rounded text-xs font-medium ${getPerformanceClass(executive.performance_category)}">
                                ${executive.performance_category || 'N/A'}
                            </span>
                        </div>
                    </td>
                    <td class="py-4 px-4">
                        <div class="flex items-center space-x-2">
                            <div class="w-16 bg-gray-200 rounded-full h-2">
                                <div class="h-2 rounded-full ${getProgressBarClass(executive.target_achievement_percentage)}"
                                     style="width: ${Math.min(100, executive.target_achievement_percentage || 0)}%"></div>
                            </div>
                            <span class="text-sm text-gray-600">${(executive.target_achievement_percentage || 0).toFixed(0)}%</span>
                        </div>
                    </td>
                    <td class="py-4 px-4 font-medium text-gray-800">${executive.total_visits_completed || 0}</td>
                    <td class="py-4 px-4 font-medium text-gray-800">${executive.referrals_generated || 0}</td>
                    <td class="py-4 px-4">
                        <div class="flex items-center space-x-1">
                            <i class="fas fa-${getTrendIcon(executive.trend)} ${getTrendClass(executive.trend)}"></i>
                            <span class="text-sm ${getTrendClass(executive.trend)}">${capitalizeFirst(executive.trend || 'Stable')}</span>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderPerformanceDistribution() {
            const ctx = document.getElementById('performanceDistributionChart').getContext('2d');

            if (performanceDistributionChart) {
                performanceDistributionChart.destroy();
            }

            const categories = ['Excellent', 'Good', 'Average', 'Needs Improvement'];
            const counts = [
                leaderboardData.filter(e => e.performance_category === 'Excellent').length,
                leaderboardData.filter(e => e.performance_category === 'Good').length,
                leaderboardData.filter(e => e.performance_category === 'Average').length,
                leaderboardData.filter(e => e.performance_category === 'Needs Improvement').length
            ];

            performanceDistributionChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: categories,
                    datasets: [{
                        data: counts,
                        backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right'
                        }
                    }
                }
            });
        }

        function renderTargetCompletion() {
            const ctx = document.getElementById('targetCompletionChart').getContext('2d');

            if (targetCompletionChart) {
                targetCompletionChart.destroy();
            }

            const achievementRates = leaderboardData.map(e => e.target_achievement_percentage || 0);
            const labels = leaderboardData.map(e => e.executive_name.split(' ')[0]); // First name only

            targetCompletionChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Target Achievement %',
                        data: achievementRates,
                        backgroundColor: achievementRates.map(rate => {
                            if (rate >= 100) return 'rgba(16, 185, 129, 0.8)';
                            if (rate >= 75) return 'rgba(59, 130, 246, 0.8)';
                            if (rate >= 50) return 'rgba(245, 158, 11, 0.8)';
                            return 'rgba(239, 68, 68, 0.8)';
                        }),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function renderPerformanceTrends() {
            const ctx = document.getElementById('performanceTrendsChart').getContext('2d');

            if (performanceTrendsChart) {
                performanceTrendsChart.destroy();
            }

            // Generate trend data (last 7 days)
            const days = Array.from({ length: 7 }, (_, i) => {
                const date = new Date();
                date.setDate(date.getDate() - (6 - i));
                return date.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' });
            });

            const avgScores = days.map(() => Math.floor(Math.random() * 20) + 70);
            const topScores = days.map(() => Math.floor(Math.random() * 15) + 85);

            performanceTrendsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: days,
                    datasets: [
                        {
                            label: 'Average Score',
                            data: avgScores,
                            borderColor: 'rgb(147, 51, 234)',
                            backgroundColor: 'rgba(147, 51, 234, 0.1)',
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: 'Top Score',
                            data: topScores,
                            borderColor: 'rgb(16, 185, 129)',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            tension: 0.4,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: false,
                            min: 50,
                            max: 100
                        }
                    }
                }
            });
        }

        // ================================================================
        // HELPER FUNCTIONS
        // ================================================================
        function getRankBadge(rank) {
            if (rank === 1) return 'bg-yellow-500';
            if (rank === 2) return 'bg-gray-400';
            if (rank === 3) return 'bg-orange-600';
            return 'bg-gray-300';
        }

        function getPerformanceClass(category) {
            if (category === 'Excellent') return 'bg-green-100 text-green-800';
            if (category === 'Good') return 'bg-blue-100 text-blue-800';
            if (category === 'Average') return 'bg-yellow-100 text-yellow-800';
            return 'bg-red-100 text-red-800';
        }

        function getProgressBarClass(percentage) {
            if (percentage >= 100) return 'bg-green-500';
            if (percentage >= 75) return 'bg-blue-500';
            if (percentage >= 50) return 'bg-yellow-500';
            return 'bg-red-500';
        }

        function getTrendIcon(trend) {
            if (trend === 'up') return 'arrow-up';
            if (trend === 'down') return 'arrow-down';
            return 'minus';
        }

        function getTrendClass(trend) {
            if (trend === 'up') return 'trend-up';
            if (trend === 'down') return 'trend-down';
            return 'trend-stable';
        }

        function capitalizeFirst(string) {
            return string.charAt(0).toUpperCase() + string.slice(1);
        }

        function exportLeaderboard() {
            // Export functionality would go here
            alert('Export functionality - would export to CSV/Excel');
        }

        function refreshData() {
            fetchPerformanceAnalytics();
        }

        // ================================================================
        // EVENT LISTENERS
        // ================================================================
        document.getElementById('periodSelect').addEventListener('change', () => {
            fetchPerformanceAnalytics();
        });

        document.getElementById('leaderboardSearch').addEventListener('input', () => {
            renderLeaderboard();
        });

        // ================================================================
        // INITIALIZATION
        // ================================================================
        async function init() {
            await fetchPerformanceAnalytics();
        }

        init();
    </script>
</body>
</html>
