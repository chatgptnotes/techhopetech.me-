<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Targets - HopeTech Marketing Executive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .progress-ring {
            transition: stroke-dashoffset 0.5s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .notification-badge {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .target-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .notification-panel {
            transition: all 0.3s ease;
        }
        .notification-panel.hidden {
            transform: translateX(100%);
            opacity: 0;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-bullseye text-2xl"></i>
                    <div>
                        <h1 class="text-xl font-bold">My Targets</h1>
                        <p class="text-blue-200 text-sm">Performance Tracking Dashboard</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <!-- Notification Bell -->
                    <div class="relative cursor-pointer" id="notificationBell">
                        <i class="fas fa-bell text-xl"></i>
                        <span class="absolute -top-2 -right-2 bg-red-500 text-xs rounded-full px-2 py-1 notification-badge" id="notificationCount" style="display: none;">0</span>
                    </div>
                    <!-- User Info -->
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-sm"></i>
                        </div>
                        <span class="font-medium" id="userName">Executive</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Quick Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-blue-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Total Targets</p>
                        <p class="text-3xl font-bold text-gray-800" id="totalTargets">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-bullseye text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-green-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Achieved</p>
                        <p class="text-3xl font-bold text-gray-800" id="achievedTargets">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-check-circle text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-yellow-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">In Progress</p>
                        <p class="text-3xl font-bold text-gray-800" id="inProgressTargets">0</p>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-spinner text-yellow-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-purple-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Overall Progress</p>
                        <p class="text-3xl font-bold text-gray-800" id="overallProgress">0%</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-chart-line text-purple-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Performance Overview Chart -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Performance Overview</h2>
            <div class="h-64">
                <canvas id="performanceChart"></canvas>
            </div>
        </div>

        <!-- Targets Grid -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-gray-800">My Targets</h2>
                <div class="flex items-center space-x-2">
                    <select id="targetFilter" class="border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="all">All Targets</option>
                        <option value="hospital_visits">Hospital Visits</option>
                        <option value="doctor_visits">Doctor Visits</option>
                        <option value="referral_meetings">Referral Meetings</option>
                        <option value="patient_referrals">Patient Referrals</option>
                    </select>
                    <select id="statusFilter" class="border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="all">All Status</option>
                        <option value="on_track">On Track</option>
                        <option value="behind">Behind Schedule</option>
                        <option value="achieved">Achieved</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="targetsGrid">
                <!-- Target cards will be dynamically inserted here -->
            </div>
        </div>

        <!-- Daily Progress Chart -->
        <div class="bg-white rounded-xl shadow-sm p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Daily Progress</h2>
            <div class="h-64">
                <canvas id="dailyProgressChart"></canvas>
            </div>
        </div>
    </main>

    <!-- Notification Panel -->
    <div id="notificationPanel" class="fixed top-0 right-0 h-full w-96 bg-white shadow-2xl notification-panel hidden z-50">
        <div class="p-6">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold text-gray-800">Notifications</h3>
                <button id="closeNotifications" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="notificationList" class="space-y-4">
                <!-- Notifications will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // STATE MANAGEMENT
        // ================================================================
        let targetsData = [];
        let notificationsData = [];
        let performanceChart = null;
        let dailyProgressChart = null;

        // ================================================================
        // API CALLS
        // ================================================================
        const API_BASE = '/api/hopetech/marketing';

        async function fetchTargets() {
            try {
                const response = await fetch(`${API_BASE}/targets?include_progress=true`);
                const result = await response.json();
                if (result.success) {
                    targetsData = result.data;
                    renderTargets();
                    updateStats();
                    renderPerformanceChart();
                }
            } catch (error) {
                console.error('Error fetching targets:', error);
            }
        }

        async function fetchNotifications() {
            try {
                const response = await fetch(`${API_BASE}/notifications?limit=10`);
                const result = await response.json();
                if (result.success) {
                    notificationsData = result.data.notifications;
                    updateNotificationBadge();
                    renderNotifications();
                }
            } catch (error) {
                console.error('Error fetching notifications:', error);
            }
        }

        async function markAsRead(notificationId) {
            try {
                await fetch(`${API_BASE}/notifications/${notificationId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'read' })
                });
                fetchNotifications();
            } catch (error) {
                console.error('Error marking notification as read:', error);
            }
        }

        // ================================================================
        // RENDERING FUNCTIONS
        // ================================================================
        function renderTargets() {
            const grid = document.getElementById('targetsGrid');
            const typeFilter = document.getElementById('targetFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            let filteredTargets = targetsData;

            if (typeFilter !== 'all') {
                filteredTargets = filteredTargets.filter(t => t.target_type === typeFilter);
            }

            if (statusFilter !== 'all') {
                filteredTargets = filteredTargets.filter(t => {
                    if (statusFilter === 'achieved') return t.achievement_percentage >= 100;
                    if (statusFilter === 'behind') return !t.is_on_track && t.achievement_percentage < 100;
                    if (statusFilter === 'on_track') return t.is_on_track && t.achievement_percentage < 100;
                    return true;
                });
            }

            grid.innerHTML = filteredTargets.map(target => `
                <div class="target-card bg-white rounded-xl shadow-sm p-6 transition-all duration-300 cursor-pointer">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center ${getTargetIconBg(target.target_type)}">
                                <i class="${getTargetIcon(target.target_type)} text-white text-lg"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">${target.target_name}</h3>
                                <p class="text-sm text-gray-500">${formatTargetType(target.target_type)}</p>
                            </div>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-medium ${getStatusBadge(target)}">
                            ${getStatusText(target)}
                        </span>
                    </div>

                    <!-- Progress Ring -->
                    <div class="flex items-center justify-center mb-4">
                        <div class="relative">
                            <svg class="w-32 h-32">
                                <circle
                                    cx="64"
                                    cy="64"
                                    r="56"
                                    stroke="#e5e7eb"
                                    stroke-width="8"
                                    fill="none"
                                />
                                <circle
                                    class="progress-ring"
                                    cx="64"
                                    cy="64"
                                    r="56"
                                    stroke="${getProgressColor(target.achievement_percentage)}"
                                    stroke-width="8"
                                    fill="none"
                                    stroke-dasharray="351.86"
                                    stroke-dashoffset="${351.86 - (351.86 * target.achievement_percentage / 100)}"
                                    stroke-linecap="round"
                                />
                            </svg>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <div class="text-center">
                                    <p class="text-2xl font-bold text-gray-800">${target.achievement_percentage.toFixed(0)}%</p>
                                    <p class="text-xs text-gray-500">Achieved</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Target Details -->
                    <div class="space-y-2 mb-4">
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-gray-500">Target</span>
                            <span class="font-medium text-gray-800">${target.target_value}</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-gray-500">Achieved</span>
                            <span class="font-medium text-gray-800">${target.achieved_value}</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-gray-500">Remaining</span>
                            <span class="font-medium text-gray-800">${target.remaining_value}</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-gray-500">Days Left</span>
                            <span class="font-medium ${target.days_remaining <= 3 ? 'text-red-600' : 'text-gray-800'}">${target.days_remaining}</span>
                        </div>
                    </div>

                    <!-- Linear Progress Bar -->
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div
                            class="h-2 rounded-full ${getProgressBarClass(target.achievement_percentage)}"
                            style="width: ${Math.min(100, target.achievement_percentage)}%"
                        ></div>
                    </div>

                    ${!target.is_on_track && target.achievement_percentage < 100 ? `
                        <div class="mt-3 p-2 bg-yellow-50 border border-yellow-200 rounded-lg">
                            <p class="text-xs text-yellow-800">
                                <i class="fas fa-exclamation-triangle mr-1"></i>
                                Behind schedule - increase your activity!
                            </p>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalTargets').textContent = targetsData.length;
            document.getElementById('achievedTargets').textContent = targetsData.filter(t => t.achievement_percentage >= 100).length;
            document.getElementById('inProgressTargets').textContent = targetsData.filter(t => t.achievement_percentage < 100 && t.achievement_percentage > 0).length;

            const overallProgress = targetsData.length > 0
                ? targetsData.reduce((sum, t) => sum + t.achievement_percentage, 0) / targetsData.length
                : 0;
            document.getElementById('overallProgress').textContent = overallProgress.toFixed(0) + '%';
        }

        function renderPerformanceChart() {
            const ctx = document.getElementById('performanceChart').getContext('2d');

            if (performanceChart) {
                performanceChart.destroy();
            }

            const labels = targetsData.map(t => t.target_name);
            const achievedData = targetsData.map(t => t.achieved_value);
            const targetData = targetsData.map(t => t.target_value);

            performanceChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Achieved',
                            data: achievedData,
                            backgroundColor: 'rgba(34, 197, 94, 0.8)',
                            borderColor: 'rgba(34, 197, 94, 1)',
                            borderWidth: 1
                        },
                        {
                            label: 'Target',
                            data: targetData,
                            backgroundColor: 'rgba(59, 130, 246, 0.3)',
                            borderColor: 'rgba(59, 130, 246, 1)',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    }
                }
            });
        }

        function renderDailyProgressChart() {
            const ctx = document.getElementById('dailyProgressChart').getContext('2d');

            if (dailyProgressChart) {
                dailyProgressChart.destroy();
            }

            // Generate sample daily progress data
            const days = Array.from({ length: 7 }, (_, i) => {
                const date = new Date();
                date.setDate(date.getDate() - (6 - i));
                return date.toLocaleDateString('en-US', { weekday: 'short' });
            });

            const dailyProgress = days.map((_, i) => Math.floor(Math.random() * 10) + 2);

            dailyProgressChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: days,
                    datasets: [{
                        label: 'Daily Achievements',
                        data: dailyProgress,
                        borderColor: 'rgb(147, 51, 234)',
                        backgroundColor: 'rgba(147, 51, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function renderNotifications() {
            const notificationList = document.getElementById('notificationList');

            if (notificationsData.length === 0) {
                notificationList.innerHTML = `
                    <div class="text-center text-gray-500 py-8">
                        <i class="fas fa-bell-slash text-4xl mb-4"></i>
                        <p>No new notifications</p>
                    </div>
                `;
                return;
            }

            notificationList.innerHTML = notificationsData.map(notification => `
                <div class="p-4 bg-gray-50 rounded-lg cursor-pointer hover:bg-gray-100 transition-colors">
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center ${getNotificationIconBg(notification.priority_level)}">
                            <i class="${getNotificationIcon(notification.notification_type)} text-white text-sm"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-medium text-gray-800 text-sm">${notification.notification_title}</p>
                            <p class="text-xs text-gray-600 mt-1">${notification.notification_message}</p>
                            <p class="text-xs text-gray-400 mt-2">${formatDate(notification.created_at)}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateNotificationBadge() {
            const badge = document.getElementById('notificationCount');
            const unreadCount = notificationsData.filter(n => n.status === 'pending').length;

            if (unreadCount > 0) {
                badge.textContent = unreadCount;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        }

        // ================================================================
        // HELPER FUNCTIONS
        // ================================================================
        function getTargetIcon(type) {
            const icons = {
                hospital_visits: 'fas fa-hospital',
                doctor_visits: 'fas fa-user-md',
                corporate_visits: 'fas fa-building',
                referral_meetings: 'fas fa-handshake',
                patient_referrals: 'fas fa-users',
                custom: 'fas fa-star'
            };
            return icons[type] || 'fas fa-bullseye';
        }

        function getTargetIconBg(type) {
            const colors = {
                hospital_visits: 'bg-blue-500',
                doctor_visits: 'bg-green-500',
                corporate_visits: 'bg-purple-500',
                referral_meetings: 'bg-orange-500',
                patient_referrals: 'bg-pink-500',
                custom: 'bg-gray-500'
            };
            return colors[type] || 'bg-gray-500';
        }

        function formatTargetType(type) {
            return type.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function getStatusBadge(target) {
            if (target.achievement_percentage >= 100) return 'bg-green-100 text-green-800';
            if (!target.is_on_track) return 'bg-red-100 text-red-800';
            return 'bg-blue-100 text-blue-800';
        }

        function getStatusText(target) {
            if (target.achievement_percentage >= 100) return 'Achieved';
            if (!target.is_on_track) return 'Behind';
            return 'On Track';
        }

        function getProgressColor(percentage) {
            if (percentage >= 100) return '#10b981';
            if (percentage >= 75) return '#3b82f6';
            if (percentage >= 50) return '#f59e0b';
            return '#ef4444';
        }

        function getProgressBarClass(percentage) {
            if (percentage >= 100) return 'bg-green-500';
            if (percentage >= 75) return 'bg-blue-500';
            if (percentage >= 50) return 'bg-yellow-500';
            return 'bg-red-500';
        }

        function getNotificationIcon(type) {
            const icons = {
                target_behind_schedule: 'fas fa-exclamation-triangle',
                mid_month_alert: 'fas fa-calendar-alt',
                deadline_approaching: 'fas fa-clock',
                monthly_completion: 'fas fa-trophy',
                underperformer_alert: 'fas fa-chart-line'
            };
            return icons[type] || 'fas fa-bell';
        }

        function getNotificationIconBg(priority) {
            if (priority === 'high') return 'bg-red-500';
            if (priority === 'medium') return 'bg-yellow-500';
            return 'bg-blue-500';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // ================================================================
        // EVENT LISTENERS
        // ================================================================
        document.getElementById('targetFilter').addEventListener('change', renderTargets);
        document.getElementById('statusFilter').addEventListener('change', renderTargets);

        document.getElementById('notificationBell').addEventListener('click', () => {
            document.getElementById('notificationPanel').classList.remove('hidden');
        });

        document.getElementById('closeNotifications').addEventListener('click', () => {
            document.getElementById('notificationPanel').classList.add('hidden');
        });

        // ================================================================
        // INITIALIZATION
        // ================================================================
        async function init() {
            await fetchTargets();
            await fetchNotifications();
            renderDailyProgressChart();
        }

        init();
    </script>
</body>
</html>
