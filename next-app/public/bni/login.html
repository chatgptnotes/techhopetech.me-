<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · HopeTech</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background:
        radial-gradient(900px 500px at 20% -10%, rgba(37,99,235,.32), transparent 55%),
        radial-gradient(700px 450px at 100% 100%, rgba(237,28,36,.18), transparent 50%),
        #0f172a;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 mb-4 text-2xl font-bold">H</div>
      <h1 class="text-2xl font-semibold">HopeTech Admin</h1>
      <p class="text-slate-400 text-sm mt-1">Secure access to CRM and marketing operations</p>
    </div>

    <form id="loginForm" class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 space-y-4" autocomplete="on">
      <div>
        <label class="block text-xs text-slate-400 mb-1.5" for="loginId">Email</label>
        <input id="loginId" name="username" type="email" autocomplete="username" required
               class="w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1.5" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500" />
      </div>
      <button id="loginBtn" type="submit"
              class="w-full rounded-lg bg-blue-600 hover:bg-blue-500 disabled:opacity-60 transition-colors py-2.5 font-medium">Sign In</button>
      <p id="loginError" class="text-rose-400 text-sm text-center hidden"></p>
    </form>

    <form id="passwordSetupForm" class="hidden bg-slate-800/60 border border-slate-700 rounded-2xl p-6 space-y-4" autocomplete="off">
      <div>
        <h2 class="text-lg font-semibold">Create your admin password</h2>
        <p class="text-slate-400 text-sm mt-1">Use at least 12 characters. This password protects CRM and marketing actions.</p>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1.5" for="newPassword">New password</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required
               class="w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1.5" for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required
               class="w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500" />
      </div>
      <button id="passwordSetupBtn" type="submit"
              class="w-full rounded-lg bg-blue-600 hover:bg-blue-500 disabled:opacity-60 transition-colors py-2.5 font-medium">Save password</button>
      <p id="passwordSetupError" class="text-rose-400 text-sm text-center hidden"></p>
    </form>

    <p class="text-center text-slate-600 text-xs mt-6">HopeTech · Secure Supabase authentication</p>
  </div>

  <script src="supabase-config.js"></script>
  <script>
  function safeNext() {
    const value = new URLSearchParams(location.search).get('next') || '';
    return /^[A-Za-z0-9_\-]+\.html(\?.*)?$/.test(value) ? value : '';
  }

  async function verifyAccess(accessToken) {
    const response = await fetch('/api/hopetech/auth/session', {
      headers: { Authorization: 'Bearer ' + accessToken },
      cache: 'no-store'
    });
    if (response.ok) return;
    const result = await response.json().catch(() => ({}));
    throw new Error(result.error || 'This account does not have administrator access');
  }

  const isInvite = new URLSearchParams(location.search).get('invited') === '1'
    || location.hash.includes('type=invite')
    || location.hash.includes('type=recovery');

  function showPasswordSetup() {
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('passwordSetupForm').classList.remove('hidden');
  }

  window.sb.auth.getSession().then(async function (result) {
    const session = result.data.session;
    if (!session) return;
    if (isInvite) return showPasswordSetup();
    try {
      await verifyAccess(session.access_token);
      location.replace(safeNext() || 'dashboard.html');
    } catch (error) {
      await window.sb.auth.signOut();
    }
  });

  window.sb.auth.onAuthStateChange(function (event, session) {
    if (session && isInvite && (event === 'SIGNED_IN' || event === 'PASSWORD_RECOVERY')) {
      showPasswordSetup();
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    const button = document.getElementById('loginBtn');
    const errorElement = document.getElementById('loginError');
    button.disabled = true;
    button.textContent = 'Signing in...';
    errorElement.classList.add('hidden');
    try {
      const result = await window.sb.auth.signInWithPassword({
        email: document.getElementById('loginId').value.trim(),
        password: document.getElementById('password').value
      });
      if (result.error) throw result.error;
      await verifyAccess(result.data.session.access_token);
      location.replace(safeNext() || 'dashboard.html');
    } catch (error) {
      await window.sb.auth.signOut();
      errorElement.textContent = error.message || 'Sign in failed';
      errorElement.classList.remove('hidden');
      document.getElementById('password').value = '';
      button.disabled = false;
      button.textContent = 'Sign In';
    }
  });

  document.getElementById('passwordSetupForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    const password = document.getElementById('newPassword').value;
    const confirmation = document.getElementById('confirmPassword').value;
    const button = document.getElementById('passwordSetupBtn');
    const errorElement = document.getElementById('passwordSetupError');
    errorElement.classList.add('hidden');
    if (password !== confirmation) {
      errorElement.textContent = 'The passwords do not match';
      errorElement.classList.remove('hidden');
      return;
    }
    button.disabled = true;
    button.textContent = 'Saving...';
    try {
      const result = await window.sb.auth.updateUser({ password });
      if (result.error) throw result.error;
      const session = await window.sb.auth.getSession();
      await verifyAccess(session.data.session.access_token);
      location.replace(safeNext() || 'social-campaign.html');
    } catch (error) {
      errorElement.textContent = error.message || 'Password setup failed';
      errorElement.classList.remove('hidden');
      button.disabled = false;
      button.textContent = 'Save password';
    }
  });
  </script>
</body>
</html>
